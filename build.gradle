plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
	// SeedcrackerX is only released on GitHub: 19MisterX98:SeedcrackerX:<tag>:<version>
	exclusiveContent {
		forRepository {
			ivy {
				name = 'GitHub releases'
				url = 'https://github.com/'
				patternLayout { artifact '[organisation]/[module]/releases/download/[revision]/seedcrackerX-[classifier].[ext]' }
				metadataSources { artifact() }
			}
		}
		filter { includeGroup '19MisterX98' }
	}
	mavenCentral()
}

sourceSets {
	// development-only client remote control; never part of the release jar
	devbridge {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	mods {
		"plainsight" {
			sourceSet sourceSets.main
		}
		"plainsight-devbridge" {
			sourceSet sourceSets.devbridge
		}
	}

	runs {
		client {
			source sourceSets.devbridge
			// JetBrains Runtime: allow hot-swapping changed classes including new methods/fields
			vmArgs "-XX:+AllowEnhancedClassRedefinition", "-Xmx4G",
					// hot-swap endpoint for tools/Hotswap.java (localhost only)
					"-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5010"
			programArgs "--username", "Dev"
		}
		// the client automated tests drive (tools/hidden-client.sh): own run directory and debug port, so it
		// can run next to a visible runClient
		hiddenClient {
			client()
			name = "Hidden Test Client"
			runDir = "run-hidden"
			source sourceSets.devbridge
			vmArgs "-XX:+AllowEnhancedClassRedefinition", "-Xmx4G",
					"-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5011"
			programArgs "--username", "Dev"
		}
		// Vanilla + Axiom (+ dev bridge, without plainsight) to study Axiom's editor UI; own run directory
		axiomClient {
			client()
			name = "Axiom Client"
			runDir = "run-axiom"
			source sourceSets.devbridge
			vmArgs "-Xmx4G", "-Dplainsight.disabled=true"
			programArgs "--username", "Dev"
		}
	}
}

configurations {
	// mods loaded from run-axiom/mods like a normal installation
	axiomMods { transitive = false }
	// other mods for the visible dev client (run/mods), installed like a normal installation
	devMods { transitive = false }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "io.github.spair:imgui-java-binding:${project.imgui_version}"
	include "io.github.spair:imgui-java-binding:${project.imgui_version}"
	for (String os : ['linux', 'windows', 'macos']) {
		implementation "io.github.spair:imgui-java-natives-${os}:${project.imgui_version}"
		include "io.github.spair:imgui-java-natives-${os}:${project.imgui_version}"
	}

	axiomMods "maven.modrinth:axiom:${project.axiom_version}"

	// visible dev client extras: distant terrain (Voxy needs this exact Sodium) and seed cracking
	devMods "maven.modrinth:voxy:${project.voxy_version}"
	devMods "maven.modrinth:sodium:${project.sodium_version}"
	devMods "maven.modrinth:cloth-config:${project.cloth_config_version}"
	devMods "19MisterX98:SeedcrackerX:${project.seedcracker_tag}:${project.seedcracker_version}@jar"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
		showStandardStreams = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// the visible client (runClient) gets the dev mods; the hidden test client stays plain so its tests
// exercise vanilla rendering
tasks.register('installDevMods', Sync) {
	from configurations.devMods
	into file('run/mods')
	preserve { exclude '*.jar' }
}
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'installDevMods' }

tasks.register('installAxiom', Copy) {
	from configurations.axiomMods
	into file('run-axiom/mods')
}
tasks.matching { it.name == 'runAxiomClient' }.configureEach { dependsOn 'installAxiom' }
